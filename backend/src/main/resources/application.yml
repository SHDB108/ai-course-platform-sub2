server:
  port: 8080

spring:
  profiles:
    # Changed from 'mock' to 'dev' to use real database
    # Remove or comment out to use no profile (default behavior with real database)
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/aicourse?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ""      # 👈 必须是英文双引号，中间不要有空格
  data:
    redis:
      # 从环境变量 REDIS_HOST 读取，如果未设置，则使用默认的 localhost
      host: ${REDIS_HOST:localhost}
      port: 6379
  jackson:
    # 配置Jackson处理Java 8时间类型
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 存储配置 (保持不变)
storage:
  type: local
  local-path: upload

# 视频文件本地存储路径
video:
  # Windows示例: D:/ai_course_videos/
  # Mac/Linux示例: /Users/yourname/videos/
  # 请根据您的操作系统和实际路径修改
  storage-path: "${VIDEO_STORAGE_PATH:D:/ai_course_videos/}"

# LLM 大语言模型配置
llm:
  ollama:
    # 从环境变量 OLLAMA_API_URL 读取
    api-url: "${OLLAMA_API_URL:http://219.216.64.87:11434/api/generate}"
    # Ollama 模型名称（与您的 curl 命令中的模型名一致）
    model: "${OLLAMA_MODEL:my-finetune-model}"

# 应用专属配置 (新增)
app:
  jwt:
    # 从环境变量 JWT_SECRET 读取，如果未设置，则使用一个默认的、不安全的密钥
    # 生产环境中必须通过环境变量设置一个长且复杂的密钥
    secret: "${JWT_SECRET:your_super_secret_key_for_aicourse_project_which_should_be_long_and_secure}"
    # JWT 过期时间（毫秒），这里是 10 小时
    expiration-ms: 36000000
